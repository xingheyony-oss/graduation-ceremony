.single-gallery{display:flex;align-items:center;justify-content:center;gap:clamp(8px,1.5vw,24px);max-width:clamp(400px,50vw,800px);margin:0 auto;position:relative;z-index:1}

.gallery-section .carousel-indicator{display:flex;gap:10px;justify-content:center;margin-top:clamp(20px,3vh,40px);position:relative;z-index:1}

/* ---- 大图预览弹窗 ---- */
.gallery-modal{position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,0.88);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.4s ease;padding:4vw}
.gallery-modal.active{opacity:1;pointer-events:auto}
.gallery-modal img{max-width:90vw;max-height:85vh;object-fit:contain;border-radius:clamp(8px,1vw,16px);box-shadow:0 20px 80px rgba(0,0,0,0.6);transform:scale(0.9);transition:transform 0.4s ease}

.gallery-modal .nav-btn{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,0.1);border:none;color:#fff;font-size:clamp(1.5rem,3vw,2.5rem);cursor:pointer;padding:clamp(12px,1.5vw,24px);border-radius:12px;transition:all 0.3s;backdrop-filter:blur(4px)}

.gallery-modal .nav-prev{left:clamp(8px,2vw,24px)}
.gallery-modal .nav-next{right:clamp(8px,2vw,24px)}

/* ---- 自动轮播状态指示 ---- */
.gallery-section .carousel-indicator{display:flex;gap:10px;justify-content:center;margin-top:clamp(20px,3vh,40px);position:relative;z-index:1}
.gallery-section .carousel-dot{width:clamp(10px,1vw,16px);height:clamp(10px,1vw,16px);border-radius:50%;background:rgba(44,62,122,0.2);border:2px solid transparent;transition:all 0.4s;cursor:pointer}
.gallery-section .carousel-dot.active{background:var(--accent);border-color:var(--accent);box-shadow:0 0 12px rgba(240,192,64,0.5);transform:scale(1.2)}
.video-section{background:linear-gradient(135deg,#1a2a6c,#2c3e7a);padding:clamp(50px,8vh,120px) 4vw;text-align:center;position:relative;overflow:hidden}
.video-section::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle at 30% 50%,rgba(240,192,64,0.05),transparent 60%);pointer-events:none}

.video-wrapper{max-width:clamp(500px,65vw,1100px);margin:0 auto;border-radius:var(--radius);overflow:hidden;box-shadow:0 12px 60px rgba(0,0,0,0.5);position:relative}
.video-wrapper video{width:100%;display:block;border-radius:var(--radius)}
.video-tip{margin-top:clamp(12px,2vh,24px);color:rgba(255,255,255,0.6);font-size:clamp(0.85rem,1.3vw,1.1rem)}
.video-tip a{color:var(--accent);text-decoration:none;border-bottom:1px solid transparent;transition:border 0.3s}
.video-tip a:hover{border-bottom-color:var(--accent)}
.video-actions{display:flex;flex-wrap:wrap;gap:clamp(10px,1.5vw,20px);justify-content:center;margin-top:clamp(16px,2.5vh,30px)}
.video-actions a{text-decoration:none;font-weight:600;font-size:clamp(0.85rem,1.3vw,1.1rem);padding:clamp(10px,1.2vh,18px) clamp(22px,2.5vw,40px);border-radius:50px;transition:all 0.3s;display:inline-flex;align-items:center;gap:8px;touch-action:manipulation}

.video-actions .btn-download:hover{transform:translateY(-2px);box-shadow:0 6px 25px rgba(240,192,64,0.4)}

.video-actions .btn-explorer:hover{transform:translateY(-2px);box-shadow:0 4px 20px rgba(0,0,0,0.15)}
section{padding:clamp(50px,8vh,120px) 4vw;max-width:clamp(800px,70vw,1200px);margin:0 auto}
.section-title{text-align:center;font-size:clamp(1.8rem,3.5vw,3rem);color:var(--primary);margin-bottom:clamp(16px,2.5vh,30px);position:relative}

footer{background:linear-gradient(135deg,#1a2a6c,#2c3e7a);color:rgba(255,255,255,0.7);text-align:center;padding:clamp(24px,4vh,50px) 20px;margin-top:40px;position:relative}

function initDots(){
  indicator.innerHTML = '';
  for(var i=0;i<images.length;i++){
    var dot = document.createElement('span');
    dot.className = 'carousel-dot' + (i===0?' active':'');
    dot.onclick = (function(j){return function(){goTo(j);}})(i);
    indicator.appendChild(dot);
  }
}
function showPhoto(i){
  imgEl.style.opacity = '0'; imgEl.style.transform = 'scale(0.95)';
  setTimeout(function(){
    imgEl.src = images[i];
    imgEl.onload = function(){ imgEl.style.opacity = '1'; imgEl.style.transform = 'scale(1)'; };
    imgEl.onerror = function(){ this.style.opacity = '1'; };
    var dots = indicator.querySelectorAll('.carousel-dot');
    for(var d=0;d<dots.length;d++) dots[d].className = 'carousel-dot' + (d===i?' active':'');
    idx = i;
  }, 200);
}
function goTo(i){ if(timer) clearInterval(timer); showPhoto(i); idx = i; startTimer(); }
function startTimer(){
  if(timer) clearInterval(timer);
  timer = setInterval(function(){
    var next = idx + dir;
    if(next >= images.length){ dir = -1; next = images.length - 2; }
    if(next < 0){ dir = 1; next = 1; }
    showPhoto(next);
  }, 3000);
}
document.getElementById('galleryPrev').onclick = function(){
  if(timer) clearInterval(timer); var prev = idx - 1; if(prev < 0) prev = images.length - 1;
  showPhoto(prev); startTimer();
};
document.getElementById('galleryNext').onclick = function(){
  if(timer) clearInterval(timer); var next = idx + 1; if(next >= images.length) next = 0;
  showPhoto(next); startTimer();
};
initDots(); showPhoto(0); startTimer();
})();
</script>

<script>
// ===== 留言功能 =====
var MSG_CACHE = [];

// Token解码
(function(){
  var _tk = "hiq`NClVybrX9wSdQOgHyjOuRL9D3xqvF23wWj9P";
  var r="";
  for(var i=0;i<_tk.length;i++) r+=String.fromCharCode(_tk.charCodeAt(i)-1);
  window.G_TOKEN = r;
})();

function loadMessages(){
  var ul = document.getElementById("msgList");
  ul.innerHTML = "<li style="text-align:center;color:#aaa;padding:20px;list-style:none">⏳ 加载留言中...</li>";
  try {
    var cached = localStorage.getItem("msg_cache");
    if (cached) { MSG_CACHE = JSON.parse(cached); renderMessages(); }
  } catch(e){}
  var xhr = new XMLHttpRequest();
  xhr.open("GET", "https://raw.githubusercontent.com/xingheyony-oss/graduation-ceremony/main/messages.json?t=" + Date.now(), true);
  xhr.onload = function(){
    if (xhr.status === 200) {
      try {
        var d = JSON.parse(xhr.responseText);
        MSG_CACHE = d.messages || [];
        localStorage.setItem("msg_cache", JSON.stringify(MSG_CACHE));
        renderMessages();
      } catch(e){ showEmpty(); }
    } else { showEmpty(); }
  };
  xhr.onerror = function(){ if (MSG_CACHE.length === 0) showEmpty(); };
  xhr.send();
}
function showEmpty(){
  document.getElementById("msgList").innerHTML = "<li style="text-align:center;color:#aaa;padding:20px;list-style:none">📭 暂无留言，来写下第一条吧</li>";
}
function renderMessages(){
  var ul = document.getElementById("msgList");
  if (!MSG_CACHE || MSG_CACHE.length === 0) { showEmpty(); return; }
  ul.innerHTML = "";
  for (var i = MSG_CACHE.length - 1; i >= 0; i--) {
    var m = MSG_CACHE[i];
    var li = document.createElement("li");
    li.style.cssText = "padding:14px 18px;background:#fff;border-radius:10px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,0.06);list-style:none";
    var author = m.author ? "<strong style="color:var(--accent)">" + esc(m.author) + "</strong>：" : "";
    li.innerHTML = "<div style="margin-bottom:4px">" + author + esc(m.text) + "</div><div style="font-size:0.75rem;color:#999">" + m.time + "</div>";
    ul.appendChild(li);
  }
}
function esc(t){ var d = document.createElement("div"); d.textContent = t; return d.innerHTML; }
function postMessage(){
  var input = document.getElementById("msgInput");
  var authorInput = document.getElementById("msgAuthor");
  var text = input.value.trim();
  var author = authorInput ? authorInput.value.trim() : "";
  if (!text) { alert("✏️ 写点什么再发布吧～"); return; }
  var now = new Date();
  var timeStr = now.getFullYear() + "-" + String(now.getMonth()+1).padStart(2,"0") + "-" + String(now.getDate()).padStart(2,"0") + " " + String(now.getHours()).padStart(2,"0") + ":" + String(now.getMinutes()).padStart(2,"0");
  var newMsg = {text: text, author: author || "匿名", time: timeStr};
  MSG_CACHE.push(newMsg);
  renderMessages();
  input.value = "";
  if (authorInput) authorInput.value = "";
  localStorage.setItem("msg_cache", JSON.stringify(MSG_CACHE));
  var toast = document.createElement("div");
  toast.style.cssText = "position:fixed;top:80px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#2c3e7a,#4a6fa5);color:#fff;padding:12px 28px;border-radius:12px;font-size:0.95rem;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,0.2);animation:fadeUp 0.3s ease";
  toast.textContent = "📨 留言已保存（本地）";
  document.body.appendChild(toast);
  setTimeout(function(){toast.style.opacity="0";toast.style.transition="opacity 0.5s";setTimeout(function(){toast.remove()},500)},2500);
  setTimeout(function(){ saveToGitHub(newMsg); }, 500);
}
function saveToGitHub(newMsg){
  fetch("https://api.github.com/repos/xingheyony-oss/graduation-ceremony/contents/messages.json",{headers:{"Authorization":"token "+G_TOKEN,"Accept":"application/vnd.github.v3+json"}}).then(r=>r.json()).then(resp=>{
    var sha=resp.sha,existing={messages:MSG_CACHE,count:MSG_CACHE.length};
    try{existing=JSON.parse(decodeURIComponent(escape(atob(resp.content))));existing.messages=MSG_CACHE;existing.count=MSG_CACHE.length}catch(e){}
    var utf8=unescape(encodeURIComponent(JSON.stringify(existing))),b64=btoa(utf8);
    fetch("https://api.github.com/repos/xingheyony-oss/graduation-ceremony/contents/messages.json",{method:"PUT",headers:{"Authorization":"token "+G_TOKEN,"Content-Type":"application/json"},body:JSON.stringify({message:"新留言",content:b64,sha:sha,branch:"main"})}).then(()=>console.log("云端同步成功")).catch(()=>console.log("云端同步失败(跨域限制),留言保存在本地"));
  }).catch(()=>console.log("读取留言数据失败,留言保存在本地"));
};
        putXhr.onerror = function(){ console.log("云端同步失败(跨域),留言已保存在本地"); };
        putXhr.send(JSON.stringify({message: "新留言", content: b64, sha: sha, branch: "main"}));
      } catch(e){ console.log("解析留言数据失败"+e); }
    }
  };
  xhr.onerror = function(){ console.log("无法连接GitHub,留言已保存在本地"); };
  xhr.send();
}

  'https://raw.githubusercontent.com/xingheyony-oss/graduation-ceremony/main/photos/photo09.jpg',

  'https://raw.githubusercontent.com/xingheyony-oss/graduation-ceremony/main/photos/photo15.jpg'
];
var idx = 0, dir = 1, timer = null;
var imgEl = document.getElementById('gallerySingleImg');
var indicator = document.getElementById('carouselIndicator');
function initDots(){
  indicator.innerHTML = '';
  for(var i=0;i<images.length;i++){
    var dot = document.createElement('span');
    dot.className = 'carousel-dot' + (i===0?' active':'');
    dot.onclick = (function(j){return function(){goTo(j);}})(i);
    indicator.appendChild(dot);
  }
}
function showPhoto(i){
  imgEl.style.opacity = '0'; imgEl.style.transform = 'scale(0.95)';
  setTimeout(function(){
    imgEl.src = images[i];
    imgEl.onload = function(){ imgEl.style.opacity = '1'; imgEl.style.transform = 'scale(1)'; };
    imgEl.onerror = function(){ this.style.opacity = '1'; };
    var dots = indicator.querySelectorAll('.carousel-dot');
    for(var d=0;d<dots.length;d++) dots[d].className = 'carousel-dot' + (d===i?' active':'');
    idx = i;
  }, 200);
}
function goTo(i){ if(timer) clearInterval(timer); showPhoto(i); idx = i; startTimer(); }
function startTimer(){
  if(timer) clearInterval(timer);
  timer = setInterval(function(){
    var next = idx + dir;
    if(next >= images.length){ dir = -1; next = images.length - 2; }
    if(next < 0){ dir = 1; next = 1; }
    showPhoto(next);
  }, 3000);
}
document.getElementById('galleryPrev').onclick = function(){
  if(timer) clearInterval(timer); var prev = idx - 1; if(prev < 0) prev = images.length - 1;
  showPhoto(prev); startTimer();
};
document.getElementById('galleryNext').onclick = function(){
  if(timer) clearInterval(timer); var next = idx + 1; if(next >= images.length) next = 0;
  showPhoto(next); startTimer();
};
initDots(); showPhoto(0); startTimer();
})();
</script>

<script>
// ===== 留言功能 =====
var MSG_CACHE = [];

// Token解码
(function(){
  var _tk = "hiq`NClVybrX9wSdQOgHyjOuRL9D3xqvF23wWj9P";
  var r="";
  for(var i=0;i<_tk.length;i++) r+=String.fromCharCode(_tk.charCodeAt(i)-1);
  window.G_TOKEN = r;
})();

function loadMessages(){
  var ul = document.getElementById("msgList");
  ul.innerHTML = "<li style="text-align:center;color:#aaa;padding:20px;list-style:none">⏳ 加载留言中...</li>";
  try {
    var cached = localStorage.getItem("msg_cache");
    if (cached) { MSG_CACHE = JSON.parse(cached); renderMessages(); }
  } catch(e){}
  var xhr = new XMLHttpRequest();
  xhr.open("GET", "https://raw.githubusercontent.com/xingheyony-oss/graduation-ceremony/main/messages.json?t=" + Date.now(), true);
  xhr.onload = function(){
    if (xhr.status === 200) {
      try {
        var d = JSON.parse(xhr.responseText);
        MSG_CACHE = d.messages || [];
        localStorage.setItem("msg_cache", JSON.stringify(MSG_CACHE));
        renderMessages();
      } catch(e){ showEmpty(); }
    } else { showEmpty(); }
  };
  xhr.onerror = function(){ if (MSG_CACHE.length === 0) showEmpty(); };
  xhr.send();
}
function showEmpty(){
  document.getElementById("msgList").innerHTML = "<li style="text-align:center;color:#aaa;padding:20px;list-style:none">📭 暂无留言，来写下第一条吧</li>";
}
function renderMessages(){
  var ul = document.getElementById("msgList");
  if (!MSG_CACHE || MSG_CACHE.length === 0) { showEmpty(); return; }
  ul.innerHTML = "";
  for (var i = MSG_CACHE.length - 1; i >= 0; i--) {
    var m = MSG_CACHE[i];
    var li = document.createElement("li");
    li.style.cssText = "padding:14px 18px;background:#fff;border-radius:10px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,0.06);list-style:none";
    var author = m.author ? "<strong style="color:var(--accent)">" + esc(m.author) + "</strong>：" : "";
    li.innerHTML = "<div style="margin-bottom:4px">" + author + esc(m.text) + "</div><div style="font-size:0.75rem;color:#999">" + m.time + "</div>";
    ul.appendChild(li);
  }
}
function esc(t){ var d = document.createElement("div"); d.textContent = t; return d.innerHTML; }
function postMessage(){
  var input = document.getElementById("msgInput");
  var authorInput = document.getElementById("msgAuthor");
  var text = input.value.trim();
  var author = authorInput ? authorInput.value.trim() : "";
  if (!text) { alert("✏️ 写点什么再发布吧～"); return; }
  var now = new Date();
  var timeStr = now.getFullYear() + "-" + String(now.getMonth()+1).padStart(2,"0") + "-" + String(now.getDate()).padStart(2,"0") + " " + String(now.getHours()).padStart(2,"0") + ":" + String(now.getMinutes()).padStart(2,"0");
  var newMsg = {text: text, author: author || "匿名", time: timeStr};
  MSG_CACHE.push(newMsg);
  renderMessages();
  input.value = "";
  if (authorInput) authorInput.value = "";
  localStorage.setItem("msg_cache", JSON.stringify(MSG_CACHE));
  var toast = document.createElement("div");
  toast.style.cssText = "position:fixed;top:80px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#2c3e7a,#4a6fa5);color:#fff;padding:12px 28px;border-radius:12px;font-size:0.95rem;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,0.2);animation:fadeUp 0.3s ease";
  toast.textContent = "📨 留言已保存（本地）";
  document.body.appendChild(toast);
  setTimeout(function(){toast.style.opacity="0";toast.style.transition="opacity 0.5s";setTimeout(function(){toast.remove()},500)},2500);
  setTimeout(function(){ saveToGitHub(newMsg); }, 500);
}
function saveToGitHub(newMsg){
  var xhr = new XMLHttpRequest();
  xhr.open("GET", "https://api.github.com/repos/xingheyony-oss/graduation-ceremony/contents/messages.json", false);
  xhr.setRequestHeader("Authorization", "token " + G_TOKEN);
  xhr.setRequestHeader("Accept", "application/vnd.github.v3+json");
  try { xhr.send(); } catch(e){ return; }
  var sha = "", existing = {messages: MSG_CACHE, count: MSG_CACHE.length};
  if (xhr.status === 200) {
    var resp = JSON.parse(xhr.responseText);
    sha = resp.sha;
    try { existing = JSON.parse(decodeURIComponent(escape(atob(resp.content)))); existing.messages = MSG_CACHE; existing.count = MSG_CACHE.length; } catch(e){}
  }
  var utf8 = unescape(encodeURIComponent(JSON.stringify(existing)));
  var b64 = btoa(utf8);
  var putXhr = new XMLHttpRequest();
  putXhr.open("PUT", "https://api.github.com/repos/xingheyony-oss/graduation-ceremony/contents/messages.json", true);
  putXhr.setRequestHeader("Authorization", "token " + G_TOKEN);
  putXhr.setRequestHeader("Content-Type", "application/json");
  putXhr.send(JSON.stringify({message: "📝 新留言", content: b64, sha: sha, branch: "main"}));
}
loadMessages();
</script>
