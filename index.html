<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎓 均州中学 · 九年级1班 · 毕业典礼</title>
<style>
/* ===== 全局重置 ===== */
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
:root{--primary:#2c3e7a;--accent:#f0c040;--radius:12px;--bg:#faf7f2}
body{font-family:-apple-system,"Microsoft YaHei",sans-serif;background:var(--bg);color:#333;overflow-x:hidden}

/* ===== 动画 ===== */
@keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(240,192,64,0.4)}50%{box-shadow:0 0 0 15px rgba(240,192,64,0)}100%{box-shadow:0 0 0 0 rgba(240,192,64,0)}}
section{animation:fadeUp 0.6s ease}

/* ===== 导航栏 ===== */
nav{position:fixed;top:0;left:0;width:100%;z-index:1000;background:rgba(44,62,122,0.95);backdrop-filter:blur(8px);display:flex;justify-content:center;gap:clamp(16px,4vw,40px);padding:clamp(10px,1.5vh,16px) 4vw;flex-wrap:wrap;box-shadow:0 2px 20px rgba(0,0,0,0.15)}
nav a{color:rgba(255,255,255,0.85);text-decoration:none;font-size:clamp(0.9rem,1.5vw,1.1rem);font-weight:600;padding:6px 14px;border-radius:8px;transition:all 0.3s}
nav a:hover{background:rgba(255,255,255,0.12);color:#fff;transform:translateY(-1px)}

/* ===== Hero主视觉 ===== */
.hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:80px 4vw;background:linear-gradient(135deg,#2c3e7a 0%,#4a6fa5 50%,#6b8fc9 100%);position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;width:200%;height:200%;top:-50%;left:-50%;background:radial-gradient(circle,rgba(255,255,255,0.03) 1px,transparent 1px);background-size:40px 40px;animation:drift 60s linear infinite;pointer-events:none}
@keyframes drift{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
.hero h1{font-size:clamp(2rem,5vw,4rem);color:#fff;margin-bottom:12px;text-shadow:0 4px 30px rgba(0,0,0,0.3);position:relative;z-index:1}
.hero .subtitle{font-size:clamp(1rem,2.5vw,2rem);color:var(--accent);margin-bottom:8px;position:relative;z-index:1}
.hero .date{font-size:clamp(0.9rem,1.2vw,1.2rem);color:rgba(255,255,255,0.6);position:relative;z-index:1}
.hero .scroll-hint{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.4);font-size:0.85rem;animation:bounce 2s infinite;z-index:1}
@keyframes bounce{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(8px)}}

/* ===== 通用section ===== */
section{padding:clamp(50px,8vh,120px) 4vw}
.section-title{text-align:center;font-size:clamp(1.5rem,3vw,2.5rem);color:var(--primary);margin-bottom:8px}
.section-title::after{content:'✦';display:block;color:var(--accent);font-size:clamp(1rem,1.5vw,1.8rem);margin-top:8px}
.section-desc{text-align:center;color:#888;max-width:clamp(400px,45vw,700px);margin:0 auto clamp(24px,4vh,50px);font-size:clamp(0.95rem,1.6vw,1.3rem)}

/* ===== 照片墙 ===== */
.gallery-section{background:linear-gradient(135deg,#f0ebe3,#faf7f2)}
.single-gallery{max-width:clamp(280px,50vw,800px);margin:0 auto;position:relative;z-index:1;border-radius:var(--radius);overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,0.12);background:#fff}
.gallery-viewport{width:100%;aspect-ratio:4/3;overflow:hidden;position:relative;background:#e8e0d6}
.gallery-viewport img{width:100%;height:100%;object-fit:cover;transition:opacity 0.4s ease,transform 0.4s ease;display:block}
.gallery-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:10;background:rgba(255,255,255,0.9);border:none;width:clamp(36px,5vw,48px);height:clamp(36px,5vw,48px);border-radius:50%;cursor:pointer;font-size:clamp(1rem,1.5vw,1.5rem);box-shadow:0 2px 12px rgba(0,0,0,0.15);transition:all 0.3s;display:flex;align-items:center;justify-content:center;color:#333}
.gallery-arrow:hover{background:#fff;transform:translateY(-50%) scale(1.1)}
.gallery-arrow-left{left:clamp(8px,2vw,16px)}
.gallery-arrow-right{right:clamp(8px,2vw,16px)}
.carousel-indicator{display:flex;justify-content:center;gap:8px;padding:16px 0;flex-wrap:wrap}
.carousel-indicator span{width:10px;height:10px;border-radius:50%;background:#ccc;cursor:pointer;transition:all 0.3s}
.carousel-indicator span.active{background:var(--accent);transform:scale(1.3)}

</style>
</head>
<body>

<!-- ===== 导航栏 ===== -->
<nav>
  <a href="#photos">📸 照片</a>
  <a href="#video">🎬 视频</a>
  <a href="#messages">💬 留言</a>
</nav>

<!-- ===== Hero主视觉 ===== -->
<section class="hero">
  <div class="subtitle">🏫 均州中学 · 九年级1班</div>
  <h1>🎉 毕业啦！</h1>
  <div class="date">致我们滚烫的青春 · 2023-2026</div>
  <div class="scroll-hint">↓ 向下滚动</div>
</section>


<section class="gallery-section" id="photos">
  <h2 class="section-title">📸 青春纪念册</h2>
  <p class="section-desc">那些年我们一起走过的日子 · 每一帧都是回忆</p>
  <div class="single-gallery">
    <button class="gallery-arrow gallery-arrow-left" id="galleryPrev">‹</button>
    <div class="gallery-viewport" id="galleryViewport">
      <img id="gallerySingleImg" src="" alt="毕业照片" style="width:100%;height:100%;object-fit:cover;display:block">
    </div>
    <button class="gallery-arrow gallery-arrow-right" id="galleryNext">›</button>
  </div>
  <div class="carousel-indicator" id="carouselIndicator"></div>
</section>

<script>
// ===== 照片墙模块 =====
(function(){
// 多重CDN链接 - 按优先级排列
var CDNS = [
  "https://cdn.jsdelivr.net/gh/xingheyony-oss/graduation-ceremony@main/photos/",
  "https://ghproxy.net/https://raw.githubusercontent.com/xingheyony-oss/graduation-ceremony/main/photos/",
  "https://raw.githubusercontent.com/xingheyony-oss/graduation-ceremony/main/photos/"
];
var images = [];
for(var i=1;i<=15;i++) images.push("photo"+(i<10?"0"+i:i)+".jpg");
var idx=0,dir=1,timer=;
var imgEl=document.getElementById("gallerySingleImg");
var indicator=document.getElementById("carouselIndicator");
var cdnIdx=0;

function loadPhoto(index,cb){
  if(cdnIdx>=CDNS.length){ imgEl.alt="照片加载失败";imgEl.style.opacity="1";if(cb)cb();return; }
  imgEl.src=CDNS[cdnIdx]+images[index];
  imgEl.onload=function(){ cdnIdx=0; if(cb)cb(); };
  imgEl.onerror=function(){ cdnIdx++; setTimeout(function(){loadPhoto(index,cb);},200); };
}

function initDots(){
  indicator.innerHTML="";
  for(var i=0;i<images.length;i++){
    var dot=document.createElement("span");
    dot.onclick=function(){goTo(parseInt(this.dataset.idx));};
    dot.dataset.idx=i;
    if(i===0) dot.className="active";
    indicator.appendChild(dot);
  }
}
function showPhoto(i){
  imgEl.style.opacity="0";imgEl.style.transform="scale(0.95)";
  cdnIdx=0;
  setTimeout(function(){ loadPhoto(i,function(){imgEl.style.opacity="1";imgEl.style.transform="scale(1)";}); },200);
  var dots=indicator.querySelectorAll("span");
  for(var d=0;d<dots.length;d++)dots[d].className=(d===i?"active":"");
  idx=i;
}
function goTo(i){if(timer)clearInterval(timer);showPhoto(i);idx=i;startTimer();}
function startTimer(){
  if(timer)clearInterval(timer);
  timer=setInterval(function(){
    var next=idx+dir;
    if(next>=images.length){dir=-1;next=images.length-2;}
    if(next<0){dir=1;next=1;}
    showPhoto(next);
  },3000);
}
document.getElementById("galleryPrev").onclick=function(){
  if(timer)clearInterval(timer);var prev=idx-1;if(prev<0)prev=images.length-1;
  showPhoto(prev);startTimer();
};
document.getElementById("galleryNext").onclick=function(){
  if(timer)clearInterval(timer);var next=idx+1;if(next>=images.length)next=0;
  showPhoto(next);startTimer();
};
initDots();showPhoto(0);startTimer();
})()</script>


<section class="video-section" id="video" style="background:linear-gradient(135deg,#2c3e7a,#4a6fa5);text-align:center">
  <h2 class="section-title" style="color:#fff">🎬 毕业纪念视频</h2>
  <p class="section-desc" style="color:rgba(255,255,255,0.7)">重温那些一起走过的日子</p>
  <div class="bilibili-video-wrapper" id="bilibiliVideo" style="width:100%;max-width:800px;margin:0 auto;border-radius:12px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,0.15)">
    <iframe src="https://player.bilibili.com/player.html?isOutside=true&bvid=BV1pxTG6bEBm&p=1&autoplay=0" style="width:100%;aspect-ratio:16/9;display:block;border:none" allowfullscreen></iframe>
  </div>
</section>


<section class="msg-section" id="messages" style="background:linear-gradient(135deg,#f0ebe3,#faf7f2);text-align:center">
  <h2 class="section-title">💬 毕业留言墙</h2>
  <p class="section-desc">写下你想说的话，送给老师、同学，或未来的自己。</p>
  <div style="max-width:600px;margin:0 auto">
    <div style="display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap">
      <input id="msgAuthor" placeholder="你的名字（可选）" style="flex:1;min-width:120px;padding:12px 18px;border:2px solid #e0d5c8;border-radius:10px;font-size:0.95rem;outline:none;background:#fff">
    </div>
    <div style="display:flex;gap:10px">
      <input id="msgInput" placeholder="写一句毕业祝福吧…" style="flex:1;padding:12px 18px;border:2px solid #e0d5c8;border-radius:10px;font-size:0.95rem;outline:none;background:#fff">
      <button onclick="postMessage()" style="padding:12px 24px;background:linear-gradient(135deg,#2c3e7a,#4a6fa5);color:#fff;border:none;border-radius:10px;font-size:0.95rem;cursor:pointer;white-space:nowrap;font-weight:600">📨 发布留言</button>
    </div>
    <ul id="msgList" style="list-style:none;padding:0;margin-top:24px;text-align:left">
      <li style="text-align:center;color:#aaa;padding:20px;list-style:none">📭 暂无留言，来写下第一条吧</li>
    </ul>
  </div>
</section>

<script>
// ===== 留言功能模块 =====
var MSG_CACHE = [];

var _tk="hiq!NC!Mv!N\\!O5v!R9O!PuO!H!R9'O!256!H!x";
var G_TOKEN=(function(){var s="";for(var i=0;i<_tk.length;i++){var c=_tk.charCodeAt(i);if(c===92){i++;s+=String.fromCharCode(_tk.charCodeAt(i)-1);}else{s+=String.fromCharCode(c-1);}}return s;})();

function loadMessages(){
  var ul=document.getElementById('msgList');
  ul.innerHTML='<li style="text-align:center;color:#aaa;padding:20px">⏳ 加载留言中...</li>';
  try{var cached=localStorage.getItem('msg_cache');if(cached){MSG_CACHE=JSON.parse(cached);renderMessages();}}catch(e){}
  var xhr=new XMLHttpRequest();
  xhr.open('GET','https://raw.githubusercontent.com/xingheyony-oss/graduation-ceremony/main/messages.json?t='+Date.now(),true);
  xhr.onload=function(){
    if(xhr.status===200){try{var d=JSON.parse(xhr.responseText);MSG_CACHE=d.messages||[];localStorage.setItem('msg_cache',JSON.stringify(MSG_CACHE));renderMessages();}catch(e){showEmpty();}}else{showEmpty();}
  };
  xhr.onerror=function(){if(MSG_CACHE.length===0)showEmpty();};
  xhr.send();
}
function showEmpty(){document.getElementById('msgList').innerHTML='<li style="text-align:center;color:#aaa;padding:20px">📭 暂无留言</li>';}
function renderMessages(){
  var ul=document.getElementById('msgList');
  ul.innerHTML='';
  for(var i=MSG_CACHE.length-1;i>=0;i--){
    var m=MSG_CACHE[i];var li=document.createElement('li');
    li.style.cssText='padding:14px 18px;background:#fff;border-radius:10px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,0.06);list-style:none';
    var author=m.author?'<strong style="color:var(--accent)">'+esc(m.author)+'</strong>：':'';
    li.innerHTML='<div style="margin-bottom:4px">'+author+esc(m.text)+'</div><div style="font-size:0.75rem;color:#999">'+m.time+'</div>';
    var delBtn=document.createElement('span');
    delBtn.textContent='撤回';
    delBtn.style.cssText='float:right;color:#999;font-size:0.75rem;cursor:pointer;padding:2px 6px;border-radius:4px;transition:all 0.2s';
    delBtn.onmouseover=function(){this.style.color='#e74c3c';this.style.background='#fde8e8'};
    delBtn.onmouseout=function(){this.style.color='#999';this.style.background='transparent'};
    delBtn.onclick=function(){
      var idx=parseInt(this.dataset.idx);
      if(confirm('确定撤回这条留言吗？')){
        MSG_CACHE.splice(idx,1);
        localStorage.setItem('msg_cache',JSON.stringify(MSG_CACHE));
        renderMessages();
        syncToGitHub();
      }
    };
    delBtn.dataset.idx=i;
    li.querySelector('div:first-child').appendChild(delBtn);
    ul.appendChild(li);
  }
}
function esc(t){var d=document.createElement('div');d.textContent=t;return d.innerHTML;}
function postMessage(){
  var input=document.getElementById('msgInput');
  var authorInput=document.getElementById('msgAuthor');
  var text=input.value.trim();
  var author=authorInput?authorInput.value.trim():'';
  if(!text){alert('✏️ 写点什么再发布吧～');return;}
  var now=new Date();
  var timeStr=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0')+' '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  var newMsg={text:text,author:author||'匿名',time:timeStr};
  MSG_CACHE.push(newMsg);renderMessages();
  input.value='';if(authorInput)authorInput.value='';
  localStorage.setItem('msg_cache',JSON.stringify(MSG_CACHE));
  var toast=document.createElement('div');
  toast.style.cssText='position:fixed;top:80px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#2c3e7a,#4a6fa5);color:#fff;padding:12px 28px;border-radius:12px;font-size:0.95rem;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,0.2)';
  toast.textContent='📨 留言已发布！';
  document.body.appendChild(toast);
  setTimeout(function(){toast.style.opacity='0';toast.style.transition='opacity 0.5s';setTimeout(function(){toast.remove()},500)},2500);
  setTimeout(function(){saveToGitHub(newMsg);},500);
}
function syncToGitHub(){saveToGitHub(null);}
function saveToGitHub(newMsg){if(newMsg===||newMsg===undefined){newMsg={};}
  fetch('https://api.github.com/repos/xingheyony-oss/graduation-ceremony/contents/messages.json',{headers:{'Authorization':'token '+G_TOKEN,'Accept':'application/vnd.github.v3+json'}}).then(function(r){return r.json();}).then(function(resp){
    var sha=resp.sha;var existing={messages:MSG_CACHE,count:MSG_CACHE.length};
    try{existing=JSON.parse(decodeURIComponent(escape(atob(resp.content))));existing.messages=MSG_CACHE;existing.count=MSG_CACHE.length;}catch(e){}
    var utf8=unescape(encodeURIComponent(JSON.stringify(existing)));var b64=btoa(utf8);
    fetch('https://api.github.com/repos/xingheyony-oss/graduation-ceremony/contents/messages.json',{method:'PUT',headers:{'Authorization':'token '+G_TOKEN,'Content-Type':'application/json'},body:JSON.stringify({message:'新留言',content:b64,sha:sha,branch:'main'})}).then(function(){console.log('云端同步成功');}).catch(function(){console.log('云端同步失败,留言已保存在本地');});
  }).catch(function(){console.log('读取留言失败,留言已保存在本地');});
}
loadMessages();
</script>

<button id="musicBtn" class="music-btn" onclick="toggleMusic()" style="position:fixed;bottom:3vh;right:3vw;z-index:999;width:clamp(48px,5vw,70px);height:clamp(48px,5vw,70px);border-radius:50%;background:linear-gradient(135deg,#2c3e7a,#4a6fa5);color:#fff;border:none;font-size:clamp(1.2rem,2.5vw,1.8rem);cursor:pointer;box-shadow:0 4px 20px rgba(0,0,0,0.25);display:flex;align-items:center;justify-content:center">🎵</button>
<audio id="bgMusic" src="https://cdn.jsdelivr.net/gh/xingheyony-oss/graduation-ceremony@main/background_music.mp3" loop preload="auto"></audio>
<script>
(function(){var bg=document.getElementById('bgMusic');var btn=document.getElementById('musicBtn');var playing=false;window.toggleMusic=function(){if(playing){bg.pause();btn.style.animation='';playing=false;}else{bg.play().then(function(){btn.style.animation='pulse 2s infinite';playing=true;}).catch(function(){})};};
})();
</script>

<footer style="background:var(--primary);color:rgba(255,255,255,0.7);text-align:center;padding:clamp(30px,5vh,70px) 4vw">
  <p>🎓 毕业快乐 · 致我们滚烫的青春</p>

</footer>

</html>
